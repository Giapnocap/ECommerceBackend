name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_AUDIT_MODE: all

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/TestRepositorySecrets.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: >-
          dotnet restore ECommerceBackend.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet format ECommerceBackend.sln --no-restore --verify-no-changes
      - run: dotnet build ECommerceBackend.sln --configuration Release --no-restore
      - run: dotnet tool install dotnet-ef --tool-path ./.tools --version 8.0.20
      - run: >-
          ./.tools/dotnet-ef migrations has-pending-model-changes
          --project src/ECommerceBackend.Infrastructure/ECommerceBackend.Infrastructure.csproj
          --startup-project src/ECommerceBackend/ECommerceBackend.csproj
          --no-build
          --configuration Release
      - shell: pwsh
        run: >-
          ./scripts/BuildMigrationArtifacts.ps1
          -OutputDirectory ./MigrationArtifacts
          -DotNetEfPath ./.tools/dotnet-ef
      - name: Run unit tests
        run: >-
          dotnet test tests/ECommerceBackend.UnitTests/ECommerceBackend.UnitTests.csproj
          --configuration Release
          --no-build
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Unit
          --logger "console;verbosity=normal"
      - name: Run integration and contract tests
        run: >-
          dotnet test tests/ECommerceBackend.IntegrationTests/ECommerceBackend.IntegrationTests.csproj
          --configuration Release
          --no-build
          --settings coverage.runsettings
          --filter "Category!=SqlServerIntegration&Category!=SqlServerRecoveryIntegration&Category!=SqlServerPerformance"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Integration
          --logger "console;verbosity=normal"
      - shell: pwsh
        run: >-
          ./scripts/VerifyCoverage.ps1
          -ReportDirectory ./TestResults
          -MinimumLineRate 80
          -MinimumBranchRate 60
      - shell: pwsh
        run: >-
          ./scripts/BuildReleasePackage.ps1
          -OutputDirectory ./ReleasePackage
          -MigrationArtifactsDirectory ./MigrationArtifacts
          -SourceRevision ${{ github.sha }}
      - shell: pwsh
        run: >-
          ./scripts/VerifyReleasePackage.ps1
          -ReleaseDirectory ./ReleasePackage
          -SmokeTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: database-migration-artifacts
          path: MigrationArtifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release-package
          path: |
            ReleasePackage/ECommerceBackend-release.zip
            ReleasePackage/ECommerceBackend-release.sha256
            ReleasePackage/release-manifest.json
          if-no-files-found: error

  sql-server-integration-tests:
    runs-on: ubuntu-latest
    env:
      RUN_SQL_INTEGRATION_TESTS: "1"
      ECOMMERCE_TEST_SQL_CONNECTION: "Server=localhost,1433;Database=ECommerceBackendIntegration;User Id=sa;Password=ECommerce!CiSql2026;TrustServerCertificate=True;Encrypt=False;"
      ECOMMERCE_MIGRATION_ARTIFACTS_DIRECTORY: "${{ github.workspace }}/MigrationArtifacts"
      ECOMMERCE_TEST_SQL_BACKUP_DIRECTORY: "/var/opt/mssql/data"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ECommerce!CiSql2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'ECommerce!CiSql2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/TestRepositorySecrets.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: >-
          dotnet restore ECommerceBackend.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build ECommerceBackend.sln --configuration Release --no-restore
      - run: dotnet tool install dotnet-ef --tool-path ./.tools --version 8.0.20
      - shell: pwsh
        run: >-
          ./scripts/BuildMigrationArtifacts.ps1
          -OutputDirectory ./MigrationArtifacts
          -DotNetEfPath ./.tools/dotnet-ef
      - run: >-
          dotnet test tests/ECommerceBackend.IntegrationTests/ECommerceBackend.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=SqlServerIntegration|Category=SqlServerRecoveryIntegration"
          --logger "console;verbosity=normal"
